<div class="wrap">
  <div class="top">
    <div><h1>Lift Log</h1><div class="muted small">Bench · Squat · Weighted pull-ups, by microcycle</div></div>
    <div class="status" id="status" aria-live="polite"></div>
  </div>

<script>
/* Standalone storage: a small localStorage-backed stand-in for the database the app was written against. Data stays in this browser; use Export/Import to back up or move it. */
(function(){
'use strict';
var P='liftlog.db.',mem={},listeners={};
function get(c){if(!mem[c]){try{mem[c]=JSON.parse(localStorage.getItem(P+c)||'{}')}catch(e){mem[c]={}}}return mem[c]}
function save(c){try{localStorage.setItem(P+c,JSON.stringify(mem[c]))}catch(e){var er=new Error('quota');er.code='quota_exceeded';throw er}}
function snap(c){var d=get(c);return {docs:Object.keys(d).map(function(id){return {id:id,exists:true,data:function(){return JSON.parse(JSON.stringify(d[id]))}}})}}
function emit(c){(listeners[c]||[]).forEach(function(f){setTimeout(function(){f(snap(c))},0)})}
function write(c,fn){try{fn(get(c));save(c)}catch(e){return Promise.reject(e)}emit(c);return Promise.resolve()}
var db={
  collection:function(c){return {
    onSnapshot:function(cb){(listeners[c]=listeners[c]||[]).push(cb);setTimeout(function(){cb(snap(c))},0)},
    add:function(data){var id='b'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);return write(c,function(d){d[id]=data}).then(function(){return {id:id}})}}},
  doc:function(p){var a=p.split('/'),c=a[0],id=a[1];return {
    set:function(v){return write(c,function(d){d[id]=JSON.parse(JSON.stringify(v))})},
    delete:function(){return write(c,function(d){delete d[id]})}}}
};
if(!window.claude)window.claude={};
if(!window.claude.use)window.claude.use=function(n){return Promise.resolve(n==='db'?db:null)};
else return; /* running inside Claude: keep its own storage */

/* First run: start MC1 with an empty bench / squat / pull-up template. */
var mcs=get('microcycles');
if(!Object.keys(mcs).length){
  var sets=[];
  [['bench',1],['squat',2],['pullup',3]].forEach(function(x){
    sets.push({ses:x[1],lift:x[0],n:1,wu:true,pct:x[0]==='pullup'?null:0.4,load:null,tr:x[0]==='pullup'?6:8,ar:null,anchor:false});
    for(var i=1;i<=3;i++)sets.push({ses:x[1],lift:x[0],n:i,wu:false,pct:null,load:null,tr:8,ar:null,anchor:i===3});
  });
  mcs.MC1={n:1,calWeeks:'',bw:null,dates:['','',''],sets:sets};
  try{save('microcycles')}catch(e){}
}

/* Export / import */
var top=document.querySelector('.top');
if(top){
  var box=document.createElement('div');box.className='chips';
  box.innerHTML='<button class="btn ghost" id="ll-exp">Export</button><button class="btn ghost" id="ll-imp">Import</button><input type="file" id="ll-file" accept="application/json" hidden>';
  top.appendChild(box);
  document.getElementById('ll-exp').onclick=function(){
    var blob=new Blob([JSON.stringify({microcycles:get('microcycles'),body:get('body')},null,1)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lift-log-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)};
  var fi=document.getElementById('ll-file');
  document.getElementById('ll-imp').onclick=function(){fi.click()};
  fi.onchange=function(){
    var f=fi.files[0];if(!f)return;
    f.text().then(function(t){
      var j=JSON.parse(t);if(!j||typeof j.microcycles!=='object')throw 0;
      if(!confirm('Replace the data in this browser with the imported file?'))return;
      mem.microcycles=j.microcycles;mem.body=j.body||{};save('microcycles');save('body');location.reload();
    }).catch(function(){alert('That file is not a Lift Log export.')});
    fi.value=''};
}
})();
</script>
<script>
(function(){
'use strict';
var COEF=0.0333;
var LIFTS=[{k:'bench',name:'Bench',ru:'Жим',inc:2.5},{k:'squat',name:'Squat',ru:'Присед',inc:2.5},{k:'pullup',name:'Pull-up',ru:'Подтягивания',inc:1.25}];
var TABS=[['train','Train'],['progress','Progress'],['body','Body'],['calc','Calculator']];
var S={db:null,checked:false,ready:false,mcs:{},body:{},tab:'train',sel:null,saving:0,readOnly:false,chain:{},timers:{},dirty:{},ver:{},draft:{date:today()},calc:{w:'',r:'',lift:'custom'},charts:[]};
try{var t=localStorage.getItem('liftlog.tab');if(t&&TABS.some(function(x){return x[0]===t}))S.tab=t;var sl=localStorage.getItem('liftlog.sel');if(sl)S.sel=sl}catch(e){}
var $app=document.getElementById('app'),$tabs=document.getElementById('tabs'),$status=document.getElementById('status'),$toast=document.getElementById('toast');

function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function f1(x){return x==null||isNaN(x)?'—':x.toFixed(1)}
function f0(x){return x==null||isNaN(x)?'—':Math.round(x).toLocaleString('en-US')}
function sg(x,d){if(x==null||isNaN(x))return '—';var s=x>0?'+':x<0?'−':'';return s+Math.abs(x).toFixed(d==null?1:d)}
var CARDIO={k:'cardio',name:'Cardio',ru:'Кардио'};
function liftOf(k){return k==='cardio'?CARDIO:LIFTS.filter(function(l){return l.k===k})[0]}
function e1rm(w,r){return w*(1+COEF*r)}
function toast(m){$toast.textContent=m;$toast.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){$toast.hidden=true},3200)}
function setStatus(){$status.textContent=!S.db?(S.checked?'Storage not available':'Connecting…'):S.readOnly?'View only':(S.saving>0||Object.keys(S.dirty).length>0)?'Saving…':S.ready?'Saved':'Loading…'}

/* ---------- model ---------- */
function list(){return Object.keys(S.mcs).map(function(k){return S.mcs[k]}).sort(function(a,b){return a.n-b.n})}
function byN(n){return S.mcs['MC'+n]}
function anchorE1(mc,k){
  if(!mc)return null;
  var s=mc.sets.filter(function(x){return x.lift===k&&x.anchor})[0];
  if(!s)return null;
  var ld=used(s,mc);
  return ld>0&&s.ar>0?e1rm(ld,s.ar):null;
}
function e1For(mc){
  var out={},prev=byN(mc.n-1);
  LIFTS.forEach(function(l){
    var st=mc.start&&mc.start[l.k];
    out[l.k]=st!=null?st:anchorE1(prev,l.k);
  });
  return out;
}
function bwFor(mc){var p=byN(mc.n-1);return p&&p.bw>0?p.bw:mc.bw}
function planned(s,mc){
  var e=e1For(mc);
  if(s.pct!=null){var v=e[s.lift];if(v==null)return null;var inc=liftOf(s.lift).inc;if(s.lift==='pullup'&&bwFor(mc)>0){var bw=bwFor(mc);return bw+Math.round((v*s.pct-bw)/inc)*inc}return Math.round(v*s.pct/inc)*inc}
  if(s.wu&&s.lift==='pullup'&&bwFor(mc)>0)return bwFor(mc)-5;
  return null;
}
function used(s,mc){return s.load!=null?s.load:planned(s,mc)}
function tonnage(mc,ses,lift,target){
  var t=0;
  mc.sets.forEach(function(s){
    if(s.wu||s.lift!==lift||(ses&&s.ses!==ses))return;
    var ld=used(s,mc),r=target?s.tr:s.ar;
    if(ld>0&&r>0)t+=ld*r;
  });
  return t;
}
function hasData(mc){return mc.sets.some(function(s){return s.lift!=='cardio'&&s.ar>0})}
function clone(o){return JSON.parse(JSON.stringify(o))}

/* ---------- persistence ---------- */
var HIST={u:{},r:{},base:{},t:{}};
function recordHist(id){
  var cur=JSON.stringify(S.mcs[id]),prev=HIST.base[id],now=Date.now();
  if(prev!=null&&prev!==cur&&now-(HIST.t[id]||0)>1200){
    (HIST.u[id]=HIST.u[id]||[]).push(prev);if(HIST.u[id].length>100)HIST.u[id].shift();HIST.r[id]=[];
  }
  if(prev!==cur)HIST.t[id]=now;
  HIST.base[id]=cur;
}
function undoRedo(dir){
  var mc=selMc();if(!mc)return;var id='MC'+mc.n;
  var from=dir<0?HIST.u[id]:HIST.r[id],to=dir<0?(HIST.r[id]=HIST.r[id]||[]):(HIST.u[id]=HIST.u[id]||[]);
  if(!from||!from.length)return;
  var cur=JSON.stringify(S.mcs[id]),st=from.pop();
  to.push(cur);S.mcs[id]=JSON.parse(st);HIST.base[id]=st;HIST.t[id]=0;
  queueSave(id,true);render();
}
function queueSave(id,nohist){
  if(!nohist)recordHist(id);
  if(!S.db||S.readOnly)return;
  clearTimeout(S.timers[id]);
  var v=(S.ver[id]||0)+1;S.ver[id]=v;S.dirty[id]=true;setStatus();
  S.timers[id]=setTimeout(function(){
    var doc=clone(S.mcs[id]);
    function done(){if(S.ver[id]===v)delete S.dirty[id];setStatus()}
    S.chain[id]=(S.chain[id]||Promise.resolve()).then(function(){return S.db.doc('microcycles/'+id).set(doc)}).then(done,function(e){delete S.dirty[id];handleWriteError(e)});
  },500);
}
function handleWriteError(e){
  var c=e&&e.code;
  if(c==='invalid_argument'||c==='revoked'){S.readOnly=true;toast('You can view this log but not change it.')}
  else if(c==='quota_exceeded')toast('Storage is full. Delete old entries to add more.');
  else toast('Could not save. Check your connection and try again.');
  setStatus();
}
function connect(tries){
  tries=tries||0;
  if(!window.claude||!window.claude.use){S.checked=true;setStatus();render();return}
  window.claude.use('db').then(function(db){
    if(!db){if(tries<3){setTimeout(function(){connect(tries+1)},1500);return}S.checked=true;S.db=null;setStatus();render();return}
    S.db=db;S.checked=true;setStatus();
    db.collection('microcycles').onSnapshot(function(snap){
      var m={};snap.docs.forEach(function(d){if(d.exists)m[d.id]=clone(d.data())});
      Object.keys(S.dirty).forEach(function(id){if(S.mcs[id])m[id]=S.mcs[id]});
      var mig=[];Object.keys(m).forEach(function(id){if(migrateCardio(m[id]))mig.push(id)});
      var same=JSON.stringify(m)===JSON.stringify(S.mcs);
      S.mcs=clone(m);S.ready=true;setStatus();
      Object.keys(m).forEach(function(id){if(!S.dirty[id])HIST.base[id]=JSON.stringify(m[id])});
      mig.forEach(function(id){queueSave(id)});
      if(!same)render();
    },function(){S.ready=true;setStatus();render()});
    db.collection('body').onSnapshot(function(snap){
      var m={};snap.docs.forEach(function(d){if(d.exists)m[d.id]=d.data()});
      var same=JSON.stringify(m)===JSON.stringify(S.body);
      S.body=clone(m);if(!same&&S.tab==='body')render();
    },function(){});

function cardioMin(m){var t=0;m.sets.forEach(function(s){if(s.lift==='cardio'&&s.minutes>0)t+=s.minutes});return t>0?t:null}
function newCardio(ses){return {ses:ses,lift:'cardio',n:1,wu:false,pct:null,load:null,tr:null,ar:null,anchor:false,activity:'',minutes:null,km:null,hr:null,notes:''}}
function migrateCardio(mc){
  if(!mc.cardio&&!mc.cardioS)return false;
  var want={};
  if(mc.cardioS)Object.keys(mc.cardioS).forEach(function(k){want[k]=mc.cardioS[k]||{}});
  if(mc.cardio){want['4']=mc.cardio;if(!want['1'])want['1']={};if(!want['3'])want['3']={};
    if(mc.cardio.date){mc.dates=mc.dates||[];while(mc.dates.length<3)mc.dates.push('');mc.dates[3]=mc.cardio.date}}
  Object.keys(want).map(Number).sort(function(a,b){return a-b}).forEach(function(ses){
    if(mc.sets.some(function(s){return s.ses===ses&&s.lift==='cardio'}))return;
    var c=want[ses],n=newCardio(ses);
    ['activity','minutes','km','hr','notes'].forEach(function(k){if(c[k]!=null)n[k]=c[k]});
    mc.sets.push(n)});
  delete mc.cardio;delete mc.cardioS;return true;
}
function cardioBlock(mc,ses,i){
  var s=mc.sets[i];
  function n(k,lab,step){return '<label class="f">'+lab+'<input type="number" step="'+step+'" inputmode="decimal" data-key="cd'+i+'-'+k+'" data-scope="cardio" data-i="'+i+'" data-f="'+k+'" value="'+(s[k]!=null?s[k]:'')+'"></label>'}
  return '<div class="lift c-cardio" data-ses="'+ses+'" data-lift="cardio"><div class="lift-h"><h3><span class="grip" draggable="true" title="Drag to reorder within this session" aria-hidden="true">⠿</span>Cardio<span class="ru">Кардио</span></h3>'+moveCtl(mc,ses,'cardio')+
    '<button class="ico mini" data-act="del" data-i="'+i+'" aria-label="Remove cardio" title="Remove cardio">×</button></div><div class="form">'+
    '<label class="f" style="grid-column:1/-1">Activity<input type="text" data-key="cd'+i+'-activity" data-scope="cardio" data-i="'+i+'" data-f="activity" value="'+esc(s.activity||'')+'" placeholder="Run, bike, rower, incline walk"></label>'+
    n('minutes','Minutes','1')+n('km','Distance km','0.1')+n('hr','Avg heart rate','1')+
    '<label class="f" style="grid-column:1/-1">Notes<input type="text" data-key="cd'+i+'-notes" data-scope="cardio" data-i="'+i+'" data-f="notes" value="'+esc(s.notes||'')+'" placeholder="Pace, zone, how it felt"></label></div></div>';
}
function sessionList(mc){var mx=0;mc.sets.forEach(function(s){if(s.ses>mx)mx=s.ses});var o=[];for(var i=1;i<=mx;i++)o.push(i);return o}
function blockOrder(mc,ses){var o=[];mc.sets.forEach(function(s){if(s.ses===ses&&o.indexOf(s.lift)<0)o.push(s.lift)});return o}
function moveBlock(mc,from,lift,to,before){
  var moving=[],rest=[];
  mc.sets.forEach(function(s){(s.ses===from&&s.lift===lift?moving:rest).push(s)});
  if(!moving.length||(from===to&&before===lift))return false;
  var merged=to!==from&&rest.some(function(s){return s.ses===to&&s.lift===lift});
  moving.forEach(function(s){s.ses=to});
  var at=-1;
  if(before)rest.forEach(function(s,i){if(at<0&&s.ses===to&&s.lift===before)at=i});
  if(at<0){rest.forEach(function(s,i){if(s.ses===to)at=i});at=at<0?rest.length:at+1}
  mc.sets=rest.slice(0,at).concat(moving,rest.slice(at));
  queueSave('MC'+mc.n);
  return merged;
}
function moveCtl(mc,ses,lift){
  var a=' data-ses="'+ses+'" data-lift="'+lift+'"';
  return '<span class="moves"><button class="ico mini" data-act="up"'+a+' aria-label="Move exercise up" title="Move up">↑</button><button class="ico mini" data-act="down"'+a+' aria-label="Move exercise down" title="Move down">↓</button>'+'</span>';
}
var NAMES={1:'Bench day',2:'Leg day',3:'Pull-up day',4:'Cardio'};
function isLeg(mc,q){var ls=mc.sets.filter(function(s){return s.ses===q});return ls.length>0&&ls.every(function(s){return s.lift==='squat'})}
function sessTitle(mc,ses){if(mc.n>=7&&NAMES[ses])return NAMES[ses];var cs=mc.sets.filter(function(s){return s.ses===ses});if(cs.length&&cs.every(function(s){return s.lift==='cardio'}))return 'Cardio';if(!isLeg(mc,ses))return 'Session '+ses;var legs=sessionList(mc).filter(function(q){return isLeg(mc,q)});return legs.length>1?'Leg day '+(legs.indexOf(ses)+1):'Leg day'}
function viewSession(mc,ses){
  var h='<div class="card sess" data-ses="'+ses+'"><div class="sess-h"><h2>'+esc(sessTitle(mc,ses))+'</h2><label class="f">Date<input type="date" data-key="d'+ses+'" data-scope="mc" data-f="date'+ses+'" value="'+esc((mc.dates||[])[ses-1]||'')+'"></label></div>';
  blockOrder(mc,ses).map(liftOf).forEach(function(x){
    var idx=[];mc.sets.forEach(function(s,i){if(s.ses===ses&&s.lift===x.k)idx.push(i)});
    if(!idx.length)return;
    if(x.k==='cardio'){h+=cardioBlock(mc,ses,idx[0]);return}
    var ctl=moveCtl(mc,ses,x.k);var ta=tonnage(mc,ses,x.k,false),tt=tonnage(mc,ses,x.k,true);
    h+='<div class="lift c-'+x.k+'" data-ses="'+ses+'" data-lift="'+x.k+'"><div class="lift-h"><h3><span class="grip" draggable="true" title="Drag to reorder within this session" aria-hidden="true">⠿</span>'+x.name+'<span class="ru">'+x.ru+'</span></h3>'+ctl+'<span class="ton" data-bind="ton-'+ses+'-'+x.k+'">'+f0(ta)+' / '+f0(tt)+' kg</span></div>'+
       '<div class="bar"><i data-bind="bar-'+ses+'-'+x.k+'" style="width:'+(tt>0?Math.min(100,ta/tt*100):0)+'%"></i></div>';
    h+='<div class="rows"><div class="rowh"><span>Set</span><span>%</span><span>kg</span><span>Target</span><span>Done</span><span></span><span></span></div>';
    var w=0;
    idx.forEach(function(i){
      var s=mc.sets[i];if(!s.wu)w++;
      var pl=planned(s,mc),ld=used(s,mc);
      var cls='row'+(s.wu?' wu':'')+(s.ar!=null&&s.tr!=null&&s.ar>=s.tr&&!s.wu?' done':'')+(s.ar!=null&&s.tr!=null&&s.ar<s.tr&&!s.wu?' miss':'');
      h+='<div class="'+cls+'" data-bind="row-'+i+'-cls"><span class="tag">'+(s.wu?'WU':w)+'</span>'+
        '<input type="number" step="0.5" inputmode="decimal" aria-label="Percent of e1RM" data-key="p'+i+'" data-scope="set" data-i="'+i+'" data-f="pct" value="'+(s.pct!=null?+(s.pct*100).toFixed(1):'')+'" placeholder="—">'+
        '<input type="number" step="0.25" inputmode="decimal" aria-label="Load in kg" class="'+(s.load==null?'planned':'')+'" data-key="l'+i+'" data-scope="set" data-i="'+i+'" data-f="load" value="'+(ld!=null?ld:'')+'" placeholder="kg">'+
        '<input type="number" step="1" inputmode="numeric" aria-label="Target reps" data-key="t'+i+'" data-scope="set" data-i="'+i+'" data-f="tr" value="'+(s.tr!=null?s.tr:'')+'">'+
        '<input type="number" step="1" inputmode="numeric" aria-label="Reps done" data-key="a'+i+'" data-scope="set" data-i="'+i+'" data-f="ar" value="'+(s.ar!=null?s.ar:'')+'">'+
        '<button class="ico hit" title="Hit the target reps" aria-label="Mark target reps done" data-act="hit" data-i="'+i+'">✓</button>'+
        '<button class="ico" title="Remove set" aria-label="Remove set" data-act="del" data-i="'+i+'">×</button></div>';
      if(x.k==='pullup')h+='<div class="anchor" data-bind="add-'+i+'">'+(ld>0&&bwFor(mc)>0?'belt '+sg(ld-bwFor(mc),2)+' kg · bw '+f1(bwFor(mc))+(byN(mc.n-1)?' (MC'+(mc.n-1)+')':''):'')+'</div>';
      if(s.anchor)h+='<div class="anchor" data-bind="anc-'+i+'">anchor · e1RM '+f1(s.ar>0&&ld>0?e1rm(ld,s.ar):null)+'</div>';
    });
    h+='</div><div><button class="btn ghost" data-act="add" data-ses="'+ses+'" data-lift="'+x.k+'">+ Add set</button> <button class="btn ghost" data-act="addwu" data-ses="'+ses+'" data-lift="'+x.k+'">+ Warm-up</button></div></div>';
  });
  if(blockOrder(mc,ses).indexOf('cardio')<0)h+='<div><button class="btn ghost" data-act="addcardio" data-ses="'+ses+'">+ Add cardio</button></div>';
  if(!blockOrder(mc,ses).length)h+='<div class="drophint">Drop an exercise here, or use the session menu on an exercise.</div>';
  return h+'</div>';
}

  mk('ch-e1',{type:'line',data:{labels:labels,datasets:ds(function(m,x){var v=e1For(m)[x.k];return v==null?null:+v.toFixed(1)})},options:baseOpts(function(o){o.scales.y.title={display:true,text:'kg',color:css('--muted')}})});
  mk('ch-rel',{type:'line',data:{labels:labels,datasets:ds(function(m,x){var v=e1For(m)[x.k];return v!=null&&m.bw>0?+(v/m.bw).toFixed(2):null})},options:baseOpts(function(o){o.scales.y.title={display:true,text:'× bodyweight',color:css('--muted')}})});
  mk('ch-ton',{type:'bar',data:{labels:labels,datasets:LIFTS.map(function(x){return {label:x.name,data:c.map(function(m){return Math.round(tonnage(m,0,x.k,false))}),backgroundColor:col[x.k],borderRadius:2}})},options:baseOpts(function(o){o.scales.x.stacked=true;o.scales.y.stacked=true;o.scales.y.title={display:true,text:'kg lifted',color:css('--muted')}})});
  mk('ch-bw',{type:'line',data:{labels:labels,datasets:[{label:'Bodyweight',data:c.map(function(m){return m.bw!=null?m.bw:null}),borderColor:css('--ink'),backgroundColor:css('--ink'),pointRadius:4,tension:0,spanGaps:true,borderWidth:2.5}]},options:baseOpts(function(o){o.plugins.legend.display=false;o.scales.y.title={display:true,text:'kg',color:css('--muted')};o.scales.y.suggestedMin=70})});
}
function drawBody(){
  var r=bodyRows().slice().reverse();if(!r.length)return;
  mk('ch-body',{type:'line',data:{labels:r.map(function(x){return x.date}),datasets:[
    {label:'Bodyweight, kg',data:r.map(function(x){return x.bw!=null?x.bw:null}),borderColor:css('--ink'),backgroundColor:css('--ink'),yAxisID:'y',pointRadius:4,tension:0,spanGaps:true,borderWidth:2.5},
    {label:'Waist, cm',data:r.map(function(x){return x.waist!=null?x.waist:null}),borderColor:css('--accent'),backgroundColor:css('--accent'),yAxisID:'y1',pointRadius:4,tension:0,spanGaps:true,borderWidth:2.5}]},
    options:baseOpts(function(o){o.scales.y.title={display:true,text:'kg',color:css('--muted')};o.scales.y1={position:'right',ticks:{color:css('--muted')},grid:{display:false},border:{display:false},title:{display:true,text:'cm',color:css('--muted')}}})});
}

/* ---------- actions ---------- */
function numOrNull(v){if(v===''||v==null)return null;var n=Number(v);return isNaN(n)?null:n}
function applyField(t,commit){
  var sc=t.dataset.scope,f=t.dataset.f;
  if(sc==='draft'){S.draft[f]=f==='date'?t.value:numOrNull(t.value);return}
  if(sc==='calc'){S.calc[f]=t.value;if(commit&&(f==='lift'))render();else refreshBinds();return}
  var mc=selMc();if(!mc)return;
  var id='MC'+mc.n;
  if(sc==='cardio'){var cs=mc.sets[+t.dataset.i];if(!cs)return;cs[f]=(f==='activity'||f==='notes')?t.value:numOrNull(t.value);queueSave(id);if(commit)render();return}
  if(sc==='mc'){
    if(f==='bw')mc.bw=numOrNull(t.value);
    else if(f==='calWeeks')mc.calWeeks=t.value;
    else if(/^date\d+$/.test(f)){var di=+f.slice(4)-1;mc.dates=mc.dates||[];for(var q=0;q<=di;q++)if(mc.dates[q]==null)mc.dates[q]='';mc.dates[di]=t.value}
  }else if(sc==='set'){
    var s=mc.sets[+t.dataset.i];if(!s)return;
    var v=numOrNull(t.value);
    if(f==='pct')s.pct=v==null?null:v/100;
    else if(f==='load')s.load=v;
    else if(f==='tr')s.tr=v;
    else if(f==='ar')s.ar=v;
  }
  queueSave(id);
  if(commit)render();else refreshBinds();
}
function act(b){
  var a=b.dataset.act,mc=selMc();
  if(a==='sel'){S.confirmDel=null;S.sel=b.dataset.id;try{localStorage.setItem('liftlog.sel',S.sel)}catch(e){}render();return}
  if(a==='hit'&&mc){var s=mc.sets[+b.dataset.i];if(s&&s.tr!=null){s.ar=s.ar===s.tr?null:s.tr;queueSave('MC'+mc.n);render()}return}
  if(a==='del'&&mc){mc.sets.splice(+b.dataset.i,1);queueSave('MC'+mc.n);render();return}
  if(a==='add'&&mc){
    var ses=+b.dataset.ses,lift=b.dataset.lift,same=mc.sets.filter(function(s){return s.ses===ses&&s.lift===lift});
    var lastW=same.filter(function(s){return !s.wu}).pop()||same.pop();
    var ns={ses:ses,lift:lift,n:same.length+1,wu:false,pct:lastW?lastW.pct:null,load:lastW&&lastW.pct==null?used(lastW,mc):null,tr:lastW?lastW.tr:8,ar:null,anchor:false};
    var at=-1;mc.sets.forEach(function(s,i){if(s.ses===ses&&s.lift===lift)at=i});
    mc.sets.splice(at+1,0,ns);queueSave('MC'+mc.n);render();return}
  if(a==='addwu'&&mc){
    var ws=+b.dataset.ses,wl=b.dataset.lift,first=-1;
    mc.sets.forEach(function(s,i){if(first<0&&s.ses===ws&&s.lift===wl)first=i});
    mc.sets.splice(first<0?mc.sets.length:first,0,{ses:ws,lift:wl,n:1,wu:true,pct:wl==='pullup'?null:0.4,load:null,tr:wl==='pullup'?6:8,ar:null,anchor:false});
    queueSave('MC'+mc.n);render();return}
  if(a==='undo'){undoRedo(-1);return}
  if(a==='redo'){undoRedo(1);return}
  if(a==='askdelmc'&&mc){S.confirmDel=mc.n;render();return}
  if(a==='cancelmc'){S.confirmDel=null;render();return}
  if(a==='delmc'&&mc){removeMc(mc);return}
  if(a==='next'&&mc){startNext();return}
  if(a==='addcardio'&&mc){mc.sets.push(newCardio(+b.dataset.ses));queueSave('MC'+mc.n);render();return}
  if((a==='up'||a==='down')&&mc){
    var ses=+b.dataset.ses,lift=b.dataset.lift,o=blockOrder(mc,ses),i=o.indexOf(lift);
    if(a==='up'&&i>0)moveBlock(mc,ses,lift,ses,o[i-1]);
    else if(a==='down'&&i>=0&&i<o.length-1)moveBlock(mc,ses,lift,ses,o[i+2]||null);
    render();return}
  if(a==='addbody'){
    var d=S.draft;if(!d.date||(d.bw==null&&d.waist==null&&d.chest==null&&d.arm==null&&d.thigh==null&&d.bf==null)){toast('Enter a date and at least one value.');return}
    if(!S.db||S.readOnly){toast('Storage is not available.');return}
    S.saving++;setStatus();
    var entry={date:d.date,bw:d.bw,waist:d.waist,chest:d.chest,arm:d.arm,thigh:d.thigh,bf:d.bf};
    Object.keys(entry).forEach(function(k){if(entry[k]==null)delete entry[k]});
    S.db.collection('body').add(entry).then(function(){S.saving--;setStatus();S.draft={date:d.date};render()},function(e){S.saving--;handleWriteError(e)});return}
  if(a==='delbody'&&S.db){S.db.doc('body/'+b.dataset.id).delete().catch(handleWriteError);return}
}
function removeMc(mc){
  var id='MC'+mc.n,l=list();
  if(l.length<2||l[l.length-1].n!==mc.n)return;
  S.confirmDel=null;
  clearTimeout(S.timers[id]);delete S.dirty[id];S.ver[id]=(S.ver[id]||0)+1;
  delete S.mcs[id];S.sel=null;
  try{localStorage.removeItem('liftlog.sel')}catch(e){}
  render();setStatus();
  if(S.db&&!S.readOnly){S.chain[id]=(S.chain[id]||Promise.resolve()).then(function(){return S.db.doc('microcycles/'+id).delete()}).then(function(){toast('MC'+mc.n+' removed.')},handleWriteError)}
}
function startNext(){
  var l=list(),last=l[l.length-1];
  if(!S.db||S.readOnly){toast('Storage is not available.');return}
  var n=last.n+1,id='MC'+n;
  var doc={n:n,calWeeks:'',bw:last.bw!=null?last.bw:null,dates:['',''],sets:last.sets.map(function(s){
    if(s.lift==='cardio')return {ses:s.ses,lift:'cardio',n:1,wu:false,pct:null,load:null,tr:null,ar:null,anchor:false,activity:s.activity||'',minutes:null,km:null,hr:null,notes:''};
    var fixed=s.pct==null&&!(s.wu&&s.lift==='pullup');
    return {ses:s.ses,lift:s.lift,n:s.n,wu:s.wu,pct:s.pct,load:fixed?used(s,last):null,tr:s.tr,ar:null,anchor:s.anchor};
  })};
  S.mcs[id]=doc;S.sel=id;
  try{localStorage.setItem('liftlog.sel',id)}catch(e){}
  render();queueSave(id);toast('MC'+n+' created from MC'+last.n+'.'+(LIFTS.every(function(x){return anchorE1(last,x.k)!=null})?'':' Loads fill in once the anchor sets of MC'+last.n+' are logged.'));
}

/* ---------- wiring ---------- */
$tabs.addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(!b)return;S.tab=b.dataset.tab;try{localStorage.setItem('liftlog.tab',S.tab)}catch(x){}render()});
$app.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(b&&!b.disabled)act(b)});
$app.addEventListener('input',function(e){var t=e.target;if(t.dataset&&t.dataset.f&&t.tagName==='INPUT'&&t.type!=='date')applyField(t,false)});
$app.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.moveto){var mc=selMc();if(mc&&moveBlock(mc,+t.dataset.ses,t.dataset.lift,+t.value,null))toast('Merged with the existing block in that session.');render();return}
  if(t.dataset&&t.dataset.f)applyField(t,true)});
var drag=null;
function clearDrop(){$app.querySelectorAll('.drop-before,.drop-end,.dragging').forEach(function(n){n.classList.remove('drop-before','drop-end','dragging')})}
$app.addEventListener('dragstart',function(e){
  var g=e.target.closest&&e.target.closest('.grip');if(!g)return;
  var b=g.closest('.lift');drag={ses:+b.dataset.ses,lift:b.dataset.lift};
  try{e.dataTransfer.setData('text/plain',drag.lift);e.dataTransfer.effectAllowed='move';e.dataTransfer.setDragImage(b,16,16)}catch(x){}
  b.classList.add('dragging')});
$app.addEventListener('dragover',function(e){
  if(!drag)return;var card=e.target.closest('.sess');if(!card||!card.dataset.ses||+card.dataset.ses!==drag.ses)return;
  e.preventDefault();clearDrop();
  var b=e.target.closest('.lift');
  if(b){if(!(+b.dataset.ses===drag.ses&&b.dataset.lift===drag.lift))b.classList.add('drop-before')}else card.classList.add('drop-end')});
$app.addEventListener('drop',function(e){
  if(!drag)return;var card=e.target.closest('.sess');if(!card||!card.dataset.ses||+card.dataset.ses!==drag.ses)return;
  e.preventDefault();
  var b=e.target.closest('.lift'),d=drag,mc=selMc();drag=null;clearDrop();
  if(mc&&moveBlock(mc,d.ses,d.lift,+card.dataset.ses,b?b.dataset.lift:null))toast('Merged with the existing block in that session.');
  render()});
$app.addEventListener('dragend',function(){drag=null;clearDrop()});
if(window.matchMedia)window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(S.tab==='progress'||S.tab==='body')render()});
new MutationObserver(function(){if(S.tab==='progress'||S.tab==='body')render()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
renderTabs();setStatus();render();connect();
})();
</script>
